- name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_SKY_0BEA56210 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/"
          api_location: "api"
          output_location: "dist"
          app_build_command: "npm run build:prod"
          ###### End of Repository/Build Configurations ######
        env:
          PRODUCTION_HOST: "polite-sky-0bea56210.4.azurestaticapps.net"
          DEVELOPER_NAME: "Soil Water Ecology Consult GmbH"
          DEVELOPER_URL: "https://swe-consult.de"
          PRIVACY_URL: "https://swe-consult.de/datenschutz"
          TERMS_URL: "https://swe-consult.de/impressum"
